# naviod RPC settings (linearize-hashes)
rpcuser=someuser
rpcpassword=somepassword
#datadir=~/.navio
host=127.0.0.1

#mainnet default
port=48471

#testnet default
#port=33677

#regtest default
#port=48486

#blsctregtest default
#port=48484

# bootstrap.dat hashlist settings (linearize-hashes)
max_height=313000

# bootstrap.dat input/output settings (linearize-data)

# mainnet
netmagic=bd5fc300
genesis=0af3c23ae1ac4910693b7187ac61641d16d1cf49cba7acf8649d48e831d86b13
input=/home/example/.navio/blocks

# testnet
#netmagic=2467d2c1
#genesis=7a04d0211de9194390c69ea0ab0d67e3c18a00c5a0b4aae65a4b5cd919e5c3e6
#input=/home/example/.navio/testnet7/blocks

# regtest
#netmagic=fdbf9ffb
#genesis=7e58358d65d178e9d32e16e5f2d63baeda88b4864cac0130ab69ca03890659ef
#input=/home/example/.navio/regtest/blocks

# blsctregtest
#netmagic=fdbf9ffb
#genesis=1f50a5ca098d358d4f328e6d74277843be011511b7f28b6e2a463c10d6a5d6d0
#input=/home/example/.navio/blsctregtest/blocks

# "output" option causes blockchain files to be written to the given location,
# with "output_file" ignored. If not used, "output_file" is used instead.
# output=/home/example/blockchain_directory
output_file=/home/example/Downloads/bootstrap.dat
hashlist=hashlist.txt

# Maximum size in bytes of out-of-order blocks cache in memory
out_of_order_cache_sz = 100000000

# Do we want the reverse the hash bytes coming from getblockhash?
rev_hash_bytes = False

# On a new month, do we want to set the access and modify times of the new
# blockchain file?
file_timestamp = 0
# Do we want to split the blockchain files given a new month or specific height?
split_timestamp = 0

# Do we want debug printouts?
debug_output = False
